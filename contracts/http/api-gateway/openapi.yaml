openapi: 3.1.0
info:
  title: CreatorFlow API Gateway
  version: 0.1.0
  description: Public API gateway untuk MVP CreatorFlow.
servers:
  - url: https://api.creatorflow.local
tags:
  - name: Health
  - name: Auth
  - name: Internal
  - name: Users
  - name: Content
  - name: Assets
  - name: Media
  - name: Publishing
  - name: Trend
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /internal/v1/observability/downstream-whoami:
    get:
      tags: [Internal]
      summary: Probe internal service auth and header propagation against media and publishing services
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Downstream whoami probe results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownstreamWhoAmIProbeResponse"
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user and workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access token
      responses:
        "200":
          description: Token rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current refresh token session
      responses:
        "204":
          description: Logout success
  /v1/me:
    get:
      tags: [Users]
      summary: Get current user and workspace context
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current session context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /v1/content/scripts:generate:
    post:
      tags: [Content]
      summary: Generate a short-form script draft
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateScriptRequest"
      responses:
        "202":
          description: Script generation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateScriptResponse"
  /v1/content/template-plans:preview:
    post:
      tags: [Content]
      summary: Preview a template render spec and scene plan for template video rendering
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewTemplatePlanRequest"
      responses:
        "200":
          description: Template plan preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewTemplatePlanResponse"
  /v1/assets/upload-url:
    post:
      tags: [Assets]
      summary: Create an upload session for a media asset
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadResponse"
  /v1/media/render-jobs:
    post:
      tags: [Media]
      summary: Enqueue a render job through the media processing service
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRenderJobGatewayRequest"
      responses:
        "202":
          description: Render job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJobGatewayResponse"
  /v1/media/render-jobs/{jobId}:
    get:
      tags: [Media]
      summary: Get render job status for the active workspace
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Render job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJobGatewayResponse"
  /v1/publishing/publish-jobs:
    post:
      tags: [Publishing]
      summary: Schedule a publish job through the publishing service
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublishJobGatewayRequest"
      responses:
        "202":
          description: Publish job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishJobGatewayResponse"
  /v1/publishing/publish-jobs/{jobId}:
    get:
      tags: [Publishing]
      summary: Get publish job status for the active workspace
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Publish job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishJobGatewayResponse"
  /v1/trend/collect:
    post:
      tags: [Trend]
      summary: Manually collect a trend signal and create a lightweight digest
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualTrendCollectRequest"
      responses:
        "201":
          description: Trend signal collected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualTrendCollectResponse"
  /v1/trend/watchlist:
    get:
      tags: [Trend]
      summary: Get current trend watchlist for the active workspace
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Workspace trend watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendWatchlistResponse"
  /v1/trend/digests/latest:
    get:
      tags: [Trend]
      summary: Get the latest trend digest for the active workspace
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [daily, weekly]
      responses:
        "200":
          description: Latest trend digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendDigestResponse"
  /v1/trend/recommendations/{recommendationId}/content-request:
    post:
      tags: [Trend]
      summary: Turn a trend recommendation into a content request
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: recommendationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteTrendToContentRequest"
      responses:
        "202":
          description: Content request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteTrendToContentResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        correlationId:
          type: string
        requestId:
          type: string
        status:
          type: string
          const: ok
    DownstreamWhoAmIProbeServiceResult:
      type: object
      required: [ok, statusCode]
      properties:
        ok:
          type: boolean
        statusCode:
          type: integer
        service:
          type: string
        error:
          type: string
        body:
          type: object
          additionalProperties: true
    DownstreamWhoAmIProbeResponse:
      type: object
      required: [status, services]
      properties:
        status:
          type: string
          const: ok
        requestId:
          type: string
        correlationId:
          type: string
        services:
          type: object
          required: [mediaProcessingService, publishingService]
          properties:
            mediaProcessingService:
              $ref: "#/components/schemas/DownstreamWhoAmIProbeServiceResult"
            publishingService:
              $ref: "#/components/schemas/DownstreamWhoAmIProbeServiceResult"
    RegisterRequest:
      type: object
      required: [email, password, workspaceName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        workspaceName:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [userId, workspaceId, accessToken, expiresIn]
      properties:
        userId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        accessToken:
          type: string
        expiresIn:
          type: string
    MeResponse:
      type: object
      required: [user, workspace]
      properties:
        user:
          type: object
          required: [id, email, status]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            fullName:
              type: string
              nullable: true
            status:
              type: string
        workspace:
          type: object
          required: [id, name, roleCode, slug]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            roleCode:
              type: string
            slug:
              type: string
    GenerateScriptRequest:
      type: object
      required: [sourceType, title]
      properties:
        workspaceId:
          type: string
          format: uuid
        sourceType:
          type: string
          enum: [manual, product, long_video, ai_generate]
        title:
          type: string
        productUrl:
          type: string
          format: uri
        languageCode:
          type: string
          default: id
        promptHint:
          type: string
    GenerateScriptResponse:
      type: object
      required: [scriptId, status]
      properties:
        scriptId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, ready]
    PreviewTemplatePlanRequest:
      type: object
      required: [niche, objective, product, script]
      properties:
        workspaceId:
          type: string
          format: uuid
        niche:
          type: string
          enum: [beauty, gadget, fashion]
        objective:
          type: string
          enum: [promo_offer, problem_solution, testimonial_style, comparison]
        variant:
          type: string
        aspectRatio:
          type: string
          enum: ["9:16", "1:1", "16:9"]
        durationSeconds:
          type: integer
          minimum: 0
        musicMode:
          type: string
          enum: [none, clean, upbeat, dramatic]
        brandTone:
          type: string
          enum: [soft, confident, direct, playful, premium]
        imageAssetIds:
          type: array
          items:
            type: string
            format: uuid
        product:
          type: object
          required: [title]
          properties:
            title:
              type: string
            subtitle:
              type: string
            description:
              type: string
            priceText:
              type: string
            offerText:
              type: string
            ctaText:
              type: string
        script:
          type: object
          required: [hook, body, cta]
          properties:
            hook:
              type: string
            body:
              type: string
            cta:
              type: string
            subtitleLines:
              type: array
              items:
                type: string
    PreviewTemplatePlanResponse:
      type: object
      required: [templateRenderSpec, scenePlan]
      properties:
        templateRenderSpec:
          type: object
          additionalProperties: true
        scenePlan:
          type: object
          additionalProperties: true
    CreateUploadRequest:
      type: object
      required: [assetType, fileName]
      properties:
        workspaceId:
          type: string
          format: uuid
        assetType:
          type: string
          enum: [video, image, audio, subtitle, thumbnail, document]
        fileName:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
    CreateUploadResponse:
      type: object
      required: [assetId, uploadId, uploadToken, uploadUrl, expiresAt]
      properties:
        assetId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
        uploadToken:
          type: string
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    CreateRenderJobGatewayRequest:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        sourceAssetId:
          type: string
          format: uuid
        scriptId:
          type: string
          format: uuid
        renderMode:
          type: string
          enum: [template_promo, ai_text_to_video, ai_image_to_video, ai_video_to_video]
        preferredProvider:
          type: string
          description: Preferred provider profile such as template, fal_veo31_fast, fal_sora2, veo3, sora, runway, or luma.
        prompt:
          type: string
        aspectRatio:
          type: string
          default: "9:16"
        durationSeconds:
          type: integer
          minimum: 0
        options:
          type: object
          additionalProperties: true
        templateRenderSpec:
          type: object
          additionalProperties: true
    RenderJobGatewayResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed, canceled]
        outputAssetId:
          type: string
          format: uuid
        providerName:
          type: string
        providerJobId:
          type: string
        preferredProvider:
          type: string
          description: Preferred provider profile such as template, fal_veo31_fast, fal_sora2, veo3, sora, runway, or luma.
        renderMode:
          type: string
          enum: [template_promo, ai_text_to_video, ai_image_to_video, ai_video_to_video]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        lastErrorMessage:
          type: string
    CreatePublishJobGatewayRequest:
      type: object
      required: [platformCode, scheduledFor]
      properties:
        workspaceId:
          type: string
          format: uuid
        connectedAccountId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        captionId:
          type: string
          format: uuid
        platformCode:
          type: string
          enum: [tiktok, instagram, facebook, youtube]
        scheduledFor:
          type: string
          format: date-time
        idempotencyKey:
          type: string
    PublishJobGatewayResponse:
      type: object
      required: [jobId, status, platformCode, scheduledFor]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [scheduled, queued, processing, published, failed, canceled]
        platformCode:
          type: string
          enum: [tiktok, instagram, facebook, youtube]
        scheduledFor:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        lastErrorMessage:
          type: string
    ManualTrendCollectRequest:
      type: object
      properties:
        sourceCode:
          type: string
        sourceName:
          type: string
        signalType:
          type: string
          enum: [topic, product, angle, keyword]
        title:
          type: string
        recommendationType:
          type: string
          enum: [topic, product, angle, cta]
        recommendationText:
          type: string
        score:
          type: number
        period:
          type: string
          enum: [daily, weekly]
        summary:
          type: string
    ManualTrendCollectResponse:
      type: object
      required: [collectionRunId, snapshotId, recommendationId, digestId, status]
      properties:
        collectionRunId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        recommendationId:
          type: string
          format: uuid
        digestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed]
    TrendWatchlistItem:
      type: object
      required: [id, signalType, title, score, recommendationText, period]
      properties:
        id:
          type: string
          format: uuid
        signalType:
          type: string
          enum: [topic, product, angle, keyword]
        title:
          type: string
        score:
          type: number
        recommendationText:
          type: string
        period:
          type: string
          enum: [daily, weekly]
    TrendWatchlistResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrendWatchlistItem"
    TrendDigestResponse:
      type: object
      required: [digestId, period, generatedAt, summary, items]
      properties:
        digestId:
          type: string
          format: uuid
        period:
          type: string
          enum: [daily, weekly]
        generatedAt:
          type: string
          format: date-time
        summary:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrendWatchlistItem"
    PromoteTrendToContentRequest:
      type: object
      properties:
        campaignId:
          type: string
          format: uuid
        titleOverride:
          type: string
        promptHint:
          type: string
    PromoteTrendToContentResponse:
      type: object
      required: [contentRequestId, status]
      properties:
        contentRequestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
